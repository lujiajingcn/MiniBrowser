<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniBrowser</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    // 在样式首次绘制前套用已保存的主题，避免启动时先闪一下浅色再变深色。
    // 这里刻意只做「读 localStorage + 打 data-theme」一件事，其它逻辑留在 renderer.js。
    (function () {
      var theme = 'system';
      try {
        theme = (JSON.parse(localStorage.getItem('mb_settings') || '{}') || {}).theme || 'system';
      } catch (e) {
        /* 数据损坏时按跟随系统处理 */
      }
      var dark =
        theme === 'dark' ||
        (theme === 'system' &&
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <!-- 工具栏图标统一走这套线性 SVG symbol：
       - 24x24 viewBox、1.7px 线宽、currentColor 着色，尺寸/颜色只由 CSS 控制；
       - 透明/非透明模式共用同一份图标，不需要为不同底色准备两套资源；
       - 带状态的图标（锁、刷新/停止、收藏）也在这里出实心变体，由 renderer.js 切换 use 的 href。 -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false" width="0" height="0">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" /></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24">
      <path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01" />
      <path d="M20.5 4v4.5H16" />
    </symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></symbol>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3.5 11 12 4l8.5 7" />
      <path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9" />
      <path d="M9.5 20v-6h5v6" />
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24">
      <rect x="5" y="10.5" width="14" height="10" rx="2" />
      <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" />
      <path d="M12 14.5v2.5" />
    </symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24">
      <rect x="5" y="10.5" width="14" height="10" rx="2" />
      <path d="M8 10.5V7a4 4 0 0 1 7.6-1.7" />
      <path d="M12 14.5v2.5" />
    </symbol>
    <symbol id="i-go" viewBox="0 0 24 24">
      <path d="M4.5 12h14" />
      <path d="m13 6.5 5.5 5.5-5.5 5.5" />
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z" />
    </symbol>
    <symbol id="i-star-filled" viewBox="0 0 24 24">
      <path
        fill="currentColor"
        stroke="none"
        d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"
      />
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.8" cy="10.8" r="6.3" />
      <path d="m15.5 15.5 4.5 4.5" />
    </symbol>
    <symbol id="i-history" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 6.8V12l3.4 2" />
    </symbol>
    <symbol id="i-devtools" viewBox="0 0 24 24">
      <path d="m9 7-5 5 5 5" />
      <path d="m15 7 5 5-5 5" />
      <path d="m13.5 4.5-3 15" />
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 3.5v11" />
      <path d="m7.5 10 4.5 4.5 4.5-4.5" />
      <path d="M4.5 16.5v3h15v-3" />
    </symbol>
    <symbol id="i-video" viewBox="0 0 24 24">
      <rect x="3" y="6" width="12.5" height="12" rx="2.5" />
      <path d="m15.5 10.5 5-3.5v10l-5-3.5z" />
    </symbol>
    <symbol id="i-save" viewBox="0 0 24 24">
      <path d="M5 3.5h11.5L20.5 7.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z" />
      <path d="M8 3.5v6h8v-6" />
      <rect x="7.5" y="13.5" width="9" height="7.5" rx="1" />
    </symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24">
      <path d="M8.8 4.5 4.5 8.8a1.5 1.5 0 0 0 0 2.1l6.6 6.6a1.5 1.5 0 0 0 2.1 0l7.5-7.5a1.5 1.5 0 0 0 0-2.1l-4.3-4.3a1.5 1.5 0 0 0-2.1 0L8.8 4.5z" />
      <path d="m7 7 10 10" />
      <path d="M4 20.5h16" />
    </symbol>
    <symbol id="i-debold" viewBox="0 0 24 24">
      <path d="M7 4.5h4.7a3.8 3.8 0 0 1 0 7.6H7z" />
      <path d="M7 12.1h5.2a4 4 0 0 1 0 8H7z" />
      <path d="M4 20.5 20.5 4" />
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24">
      <rect x="7" y="3" width="10" height="4" rx="2" />
      <path d="M8.6 7h6.8l-1.1 5.2H9.7z" />
      <path d="M12 12.2v8.3" />
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" />
      <path
        d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.08a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.08A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.96 4.6h.08A1.7 1.7 0 0 0 10.6 3.04V3a2 2 0 1 1 4 0v.08a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 8.96v.08a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.08a1.7 1.7 0 0 0-1.52 1.92z"
      />
    </symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="1.5" /></symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12" />
      <path d="M18 6 6 18" />
    </symbol>
  </svg>

  <!-- 无框模式下，工具栏被隐藏，此处用一条细的拖拽热区替代：在窗口正上方边缘按住左键可拖动窗口 -->
  <div id="frameless-drag-strip" aria-hidden="true"></div>

  <!-- 无框模式2：同样隐藏工具栏等部件，但在窗口四角保留「∟」形直角，
       用于标识页面范围（无框后窗口没有系统标题栏，缺少边界参照）。 -->
  <div id="frameless2-corners" aria-hidden="true">
    <i class="corner tl"></i>
    <i class="corner tr"></i>
    <i class="corner bl"></i>
    <i class="corner br"></i>
  </div>
  <header class="toolbar">
    <div class="nav-buttons">
      <button id="back" title="后退" aria-label="后退">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-back"></use></svg>
      </button>
      <button id="forward" title="前进" aria-label="前进">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-forward"></use></svg>
      </button>
      <button id="reload" title="刷新 / 停止" aria-label="刷新">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-reload"></use></svg>
      </button>
      <button id="home" title="主页" aria-label="主页">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-home"></use></svg>
      </button>
    </div>

    <div class="url-bar">
      <span id="lock" class="lock" title="">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-lock"></use></svg>
      </span>
      <img id="favicon" class="favicon" alt="" />
      <input id="url" type="text" placeholder="输入网址，例如 example.com" spellcheck="false" autocomplete="off" />
      <button id="go" title="前往" aria-label="前往">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-go"></use></svg>
      </button>
      <button id="bookmark" title="收藏当前页" aria-label="收藏">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-star"></use></svg>
      </button>
    </div>

    <div class="extra-buttons">
      <button id="find" title="在页面中查找 (Ctrl+F)" aria-label="查找">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
      </button>
      <button id="history" title="历史记录" aria-label="历史">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-history"></use></svg>
      </button>
      <button id="devtools" title="开发者工具" aria-label="开发者工具">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-devtools"></use></svg>
      </button>
      <button id="downloads" title="下载" aria-label="下载">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-download"></use></svg>
        <span id="dl-badge" class="dl-badge hidden">0</span>
      </button>
      <button id="video-dl" title="下载页面视频" aria-label="下载页面视频">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-video"></use></svg>
      </button>
      <button id="save-page" title="保存页面（离线查看）" aria-label="保存页面">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-save"></use></svg>
      </button>
      <button
        id="eraser"
        class="eraser-btn"
        title="橡皮擦：选中后点击页面元素即可删除该元素及其全部子元素"
        aria-label="橡皮擦"
        aria-pressed="false"
      >
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-eraser"></use></svg>
      </button>
      <button
        id="debold"
        class="debold-btn"
        title="去除粗体：把当前页面的粗体字全部改成常规字重（再次点击恢复）"
        aria-label="去除粗体"
        aria-pressed="false"
      >
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-debold"></use></svg>
      </button>
      <button
        id="pin"
        class="pin-btn"
        title="钉在桌面：窗口始终保持在最前方（再次点击取消）"
        aria-label="钉在桌面"
        aria-pressed="false"
      >
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pin"></use></svg>
      </button>
      <button id="zoom" class="zoom-btn" title="缩放级别 (Ctrl+0 恢复默认)" aria-label="缩放">100%</button>
      <button id="settings" title="设置" aria-label="设置">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-settings"></use></svg>
      </button>
    </div>

    <div class="win-controls">
      <button id="win-min" class="win-btn" title="最小化" aria-label="最小化">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-min"></use></svg>
      </button>
      <button id="win-max" class="win-btn" title="最大化 / 还原" aria-label="最大化">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-max"></use></svg>
      </button>
      <button id="win-close" class="win-btn win-close" title="关闭" aria-label="关闭">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
      </button>
    </div>
  </header>

  <div id="bookmarks-bar" class="bookmarks-bar"></div>

  <div id="bm-popover" class="bm-popover hidden">
    <div class="bm-popover-head">
      <div id="bm-crumbs" class="bm-crumbs"></div>
      <button id="bm-popover-close" type="button" class="bm-popover-close" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div id="bm-header" class="bm-header"></div>
    <div id="bm-list" class="bm-list"></div>
    <div class="bm-actions">
      <button id="bm-new-folder" type="button">➕ 新建文件夹</button>
      <button id="bm-add-current" type="button">⭐ 收藏当前页</button>
    </div>
  </div>

  <div id="tab-bar" class="tab-bar"></div>

  <div id="loading" class="loading-bar"></div>

  <div id="find-bar" class="find-bar hidden">
    <input
      id="find-input"
      type="text"
      placeholder="在页面中查找"
      spellcheck="false"
      autocomplete="off"
    />
    <span id="find-count" class="find-count"></span>
    <button id="find-prev" title="上一处 (Shift+Enter)" aria-label="上一处">▲</button>
    <button id="find-next" title="下一处 (Enter)" aria-label="下一处">▼</button>
    <button id="find-close" title="关闭 (Esc)" aria-label="关闭查找">✕</button>
  </div>

  <div id="webview-container" class="webview-container"></div>

  <div id="history-panel" class="history-panel hidden">
    <div class="history-head">
      <span>历史记录</span>
      <button id="history-clear" title="清空历史">清空</button>
    </div>
    <ul id="history-list" class="history-list"></ul>
  </div>

  <div id="downloads-panel" class="downloads-panel hidden">
    <div class="downloads-head">
      <span>下载</span>
      <button id="downloads-clear" title="清除已完成">清除已完成</button>
    </div>
    <ul id="downloads-list" class="downloads-list"></ul>
  </div>

  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-head"><span>设置</span></div>
    <div class="settings-body">
      <label class="settings-row">
        <span>外观主题</span>
        <select id="set-theme">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
      <label class="settings-row">
        <span>主页地址</span>
        <input id="set-home" type="text" spellcheck="false" autocomplete="off" />
      </label>
      <label class="settings-row">
        <span>搜索引擎</span>
        <select id="set-engine">
          <option value="bing">Bing</option>
          <option value="google">Google</option>
          <option value="baidu">百度</option>
        </select>
      </label>
      <label class="settings-row settings-check">
        <input id="set-restore" type="checkbox" />
        <span>启动时恢复上次会话</span>
      </label>
      <label class="settings-row settings-check">
        <input id="set-newtab" type="checkbox" />
        <span>链接在新标签中打开</span>
      </label>
      <div class="settings-row">
        <span>下载目录</span>
        <div class="settings-actions">
          <span id="set-dl-dir" class="dl-dir" title="">默认（下载）</span>
          <button id="set-dl-choose" type="button">更改…</button>
        </div>
      </div>
      <label class="settings-row settings-check">
        <input id="set-ask-save" type="checkbox" />
        <span>下载前询问保存位置</span>
      </label>
      <div class="settings-row">
        <span>清除浏览数据</span>
        <div class="settings-actions">
          <button id="set-clear-history">历史</button>
          <button id="set-clear-bookmarks">收藏</button>
          <button id="set-clear-all">全部</button>
        </div>
      </div>
      <div class="settings-row">
        <span>收藏夹</span>
        <div class="settings-actions">
          <button id="set-import-bookmarks" type="button">导入…</button>
          <button id="set-export-bookmarks" type="button">导出…</button>
        </div>
      </div>
      <input id="set-import-file" type="file" accept=".html,.htm,text/html" class="hidden" />
    </div>
  </div>

  <div id="context-menu" class="context-menu hidden">
    <ul id="context-menu-list"></ul>
  </div>

  <!-- 缩放菜单：点击工具栏的缩放按钮弹出，可选百分比 / 恢复默认 -->
  <div id="zoom-menu" class="zoom-menu hidden">
    <ul id="zoom-menu-list"></ul>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="bookmarks-io.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
